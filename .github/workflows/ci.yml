name: CI and Release

# For private repositories set MATEERP_CI_RUNNER_LABELS as a repository
# variable to JSON: ["self-hosted","linux","x64","mateerp-ci"].
# Keep the runner physically separate from the production VPS.
concurrency:
  group: mateerp-ci-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ${{ fromJSON(vars.MATEERP_CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: mateerp
          POSTGRES_USER: mateerp
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mateerp -d mateerp"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://mateerp:ci-only-password@localhost:5432/mateerp
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: pytest
      - run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

  frontend:
    runs-on: ${{ fromJSON(vars.MATEERP_CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  images:
    name: GHCR ${{ matrix.component }}
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [backend, frontend]
    runs-on: ${{ fromJSON(vars.MATEERP_CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        component: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          target: prod
          push: true
          build-args: |
            MATEERP_BACKEND_URL=http://backend:8000
          tags: ghcr.io/rizwansammo/mateerp-${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/rizwansammo/MateERP
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          cache-from: type=gha,scope=mateerp-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=mateerp-${{ matrix.component }}

  staging:
    name: Verify GHCR images in isolated HTTPS staging
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [images]
    runs-on: ${{ fromJSON(vars.MATEERP_CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Isolated SSL staging using the actual GHCR images
        env:
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d "${RUNNER_TEMP}/mateerp7e.XXXXXXXX")"
          project="mateerp7e"
          finish() {
            cd "$work"
            docker compose -p "$project" --env-file .env.staging -f compose.staging.yml down --volumes --remove-orphans --timeout 20 || true
            cd /
            rm -rf "$work"
          }
          trap finish EXIT INT TERM
          test -z "$(docker ps -aq --filter label=com.docker.compose.project="$project")"
          cp deploy/staging/compose.staging.yml "$work/compose.staging.yml"
          cp deploy/staging/nginx.staging.conf "$work/nginx.staging.conf"
          cd "$work"
          printf 'MATEERP_IMAGE_TAG=sha-%s\nMATEERP_DB_PASSWORD=%s\nDJANGO_SECRET_KEY=%s\n'             "$RELEASE_SHA" "$(openssl rand -hex 24)" "$(openssl rand -hex 48)" > .env.staging
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1             -keyout key.pem -out cert.pem             -subj /CN=erp.netamate.com             -addext subjectAltName=DNS:erp.netamate.com >/dev/null 2>&1
          docker compose -p "$project" --env-file .env.staging -f compose.staging.yml config --quiet
          docker compose -p "$project" --env-file .env.staging -f compose.staging.yml pull
          docker compose -p "$project" --env-file .env.staging -f compose.staging.yml up -d --wait --wait-timeout 150 database
          docker compose -p "$project" --env-file .env.staging -f compose.staging.yml run --rm --no-deps backend python manage.py migrate --noinput
          docker compose -p "$project" --env-file .env.staging -f compose.staging.yml up -d --wait --wait-timeout 180 backend frontend tls
          curl -kfsS --retry 6 --retry-delay 2 --resolve erp.netamate.com:18443:127.0.0.1             https://erp.netamate.com:18443/api/v1/health/ | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
          curl -kfsS --retry 6 --retry-delay 2 --resolve erp.netamate.com:18443:127.0.0.1             -o /dev/null https://erp.netamate.com:18443/login
          echo 'GHCR-sourced PostgreSQL 18 + Django + Next.js + TLS staging verified'

  deploy:
    name: Gated production deployment
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          vars.MATEERP_AUTO_DEPLOY_ENABLED == 'true' }}
    needs: [staging]
    runs-on: ${{ fromJSON(vars.MATEERP_CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    permissions:
      contents: read
    environment: production
    concurrency:
      group: mateerp-production
      cancel-in-progress: false
    env:
      TARGET_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
      SSH_HOST: ${{ vars.MATEERP_DEPLOY_HOST }}
      SSH_PORT: ${{ vars.MATEERP_DEPLOY_PORT }}
      SSH_USER: ${{ vars.MATEERP_DEPLOY_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.MATEERP_DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.MATEERP_DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Confirm newest tested commit and credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          (( SSH_PORT >= 1 && SSH_PORT <= 65535 ))
          [[ -n "$SSH_HOST" && -n "$SSH_USER" && -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          latest="$(curl -fsS --retry 3 --retry-delay 2             -H "Authorization: Bearer $GITHUB_TOKEN"             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main"             | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
          test "$latest" = "$TARGET_SHA"
      - name: Deploy verified SHA via restricted SSH
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/mateerp_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/mateerp_deploy_key" "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -T -i "$HOME/.ssh/mateerp_deploy_key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" "deploy sha-$TARGET_SHA"
