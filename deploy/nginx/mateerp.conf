# Deploy only at Phase 7F with explicit production go-live approval.
server {
    listen 80;
    listen [::]:80;
    server_name erp.netamate.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name erp.netamate.com;
    ssl_certificate /etc/letsencrypt/live/erp.netamate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.netamate.com/privkey.pem;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security 'max-age=31536000' always;

    location / {
        proxy_pass http://127.0.0.1:3035;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_connect_timeout 5s;
    }
}
