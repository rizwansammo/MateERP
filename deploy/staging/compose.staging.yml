name: mateerp7e
services:
  database:
    image: postgres:18.6-alpine
    restart: "no"
    environment:
      POSTGRES_DB: mateerp_stage
      POSTGRES_USER: mateerp_stage
      POSTGRES_PASSWORD: ${MATEERP_DB_PASSWORD:?required}
    volumes: [pgdata:/var/lib/postgresql]
    networks: [private]
    mem_limit: 576m
    cpus: '0.5'
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 24
  backend:
    image: ghcr.io/rizwansammo/mateerp-backend:${MATEERP_IMAGE_TAG:?required}
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?required}
      DATABASE_URL: postgres://mateerp_stage:${MATEERP_DB_PASSWORD:?required}@database:5432/mateerp_stage
      DJANGO_ALLOWED_HOSTS: erp.netamate.com,backend
      DJANGO_CSRF_TRUSTED_ORIGINS: https://erp.netamate.com:18443,https://erp.netamate.com
      DJANGO_TIME_ZONE: Asia/Dhaka
      DJANGO_SECURE_SSL_REDIRECT: 'false'
      DJANGO_SECURE_HSTS_SECONDS: '0'
      PRIVATE_STORAGE_ROOT: /data/storage
    command: [gunicorn, config.wsgi:application, --bind, 0.0.0.0:8000, --workers, '1', --threads, '2', --timeout, '90', --access-logfile, '-']
    volumes: [documents:/data/storage]
    networks: [private]
    depends_on:
      database: {condition: service_healthy}
    cap_drop: [ALL]
    mem_limit: 768m
    cpus: '0.7'
    pids_limit: 200
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/v1/health/',headers={'Host':'backend','X-Forwarded-Proto':'https'}); assert urllib.request.urlopen(r,timeout=5).status==200"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 55s
  frontend:
    image: ghcr.io/rizwansammo/mateerp-frontend:${MATEERP_IMAGE_TAG:?required}
    restart: "no"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      MATEERP_BACKEND_URL: http://backend:8000
      HOSTNAME: 0.0.0.0
      PORT: '3000'
    ports: ['127.0.0.1:13035:3000']
    networks: [private, ingress]
    depends_on:
      backend: {condition: service_healthy}
    cap_drop: [ALL]
    mem_limit: 576m
    cpus: '0.6'
    pids_limit: 180
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 55s
  tls:
    image: nginx:1.29-alpine
    restart: "no"
    ports: ['127.0.0.1:18443:443']
    volumes:
      - ./nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./cert.pem:/etc/nginx/tls/cert.pem:ro
      - ./key.pem:/etc/nginx/tls/key.pem:ro
    networks: [ingress]
    depends_on:
      frontend: {condition: service_healthy}
    # nginx root master needs CHOWN/SETUID while creating its isolated
    # ephemeral writable cache; host mappings stay loopback-only.
    mem_limit: 96m
    cpus: '0.2'
    pids_limit: 64
networks:
  private: {internal: true}
  ingress: {driver: bridge}
volumes:
  pgdata: {}
  documents: {}
