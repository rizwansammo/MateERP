<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>
@font-face { font-family: "Plex Sans"; font-weight: 400; src: url("{{ fonts }}/ibm-plex-sans-latin-400-normal.woff2"); }
@font-face { font-family: "Plex Sans"; font-weight: 500; src: url("{{ fonts }}/ibm-plex-sans-latin-500-normal.woff2"); }
@font-face { font-family: "Plex Sans"; font-weight: 600; src: url("{{ fonts }}/ibm-plex-sans-latin-600-normal.woff2"); }
@font-face { font-family: "Plex Sans"; font-weight: 700; src: url("{{ fonts }}/ibm-plex-sans-latin-700-normal.woff2"); }
@font-face { font-family: "Plex Sans"; font-weight: 800; src: url("{{ fonts }}/ibm-plex-sans-latin-700-normal.woff2"); }
@font-face { font-family: "Plex Sans Ext"; font-weight: 400; src: url("{{ fonts }}/ibm-plex-sans-latin-ext-400-normal.woff2"); }
@font-face { font-family: "Plex Sans Ext"; font-weight: 600; src: url("{{ fonts }}/ibm-plex-sans-latin-ext-600-normal.woff2"); }
@font-face { font-family: "Plex Sans Ext"; font-weight: 700; src: url("{{ fonts }}/ibm-plex-sans-latin-ext-700-normal.woff2"); }
@font-face { font-family: "Plex Serif"; font-weight: 400; src: url("{{ fonts }}/ibm-plex-serif-latin-400-normal.woff2"); }
@font-face { font-family: "Plex Serif"; font-weight: 600; src: url("{{ fonts }}/ibm-plex-serif-latin-600-normal.woff2"); }
@font-face { font-family: "Plex Serif"; font-weight: 700; src: url("{{ fonts }}/ibm-plex-serif-latin-700-normal.woff2"); }
@font-face { font-family: "Plex Mono"; font-weight: 400; src: url("{{ fonts }}/ibm-plex-mono-latin-400-normal.woff2"); }
@font-face { font-family: "Plex Mono"; font-weight: 600; src: url("{{ fonts }}/ibm-plex-mono-latin-600-normal.woff2"); }
@font-face { font-family: "Noto Sans Bengali"; font-weight: 400; src: url("{{ fonts }}/noto-sans-bengali-bengali-400-normal.woff2"); }
@font-face { font-family: "Noto Sans Bengali"; font-weight: 600; src: url("{{ fonts }}/noto-sans-bengali-bengali-600-normal.woff2"); }
@font-face { font-family: "Noto Sans Bengali"; font-weight: 700; src: url("{{ fonts }}/noto-sans-bengali-bengali-700-normal.woff2"); }
@font-face { font-family: "Noto Sans Bengali"; font-weight: 800; src: url("{{ fonts }}/noto-sans-bengali-bengali-700-normal.woff2"); }
@font-face { font-family: "Signature"; font-weight: 400; src: url("{{ fonts }}/herr-von-muellerhoff-latin-400-normal.woff2"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #FFFFFF; color: #111827; }
body { font-family: {{ ff|safe }}; font-size: 11.5px; line-height: 1.45; }
.nf { font-family: {{ nf|safe }}; }
.num { font-family: {{ nf|safe }}; font-variant-numeric: tabular-nums; }
.label { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
.caption { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
.pre { white-space: pre-line; }
.muted { color: #6B7280; }
.watermark { position: fixed; left: 0; right: 0; top: 40%; text-align: center; }
.watermark span { display: inline-block; transform: rotate(-28deg); font-size: 120px; font-weight: 800; letter-spacing: .1em; color: rgba(17,24,39,.07); border: 8px solid rgba(17,24,39,.07); padding: 0 30px; }
{% block style %}{% endblock %}
</style>
</head>
<body>
{% block body %}{% endblock %}
{% if watermark %}<div class="watermark"><span>{{ watermark }}</span></div>{% endif %}
</body>
</html>
